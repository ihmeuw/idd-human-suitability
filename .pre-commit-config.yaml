repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        # The pre-commit mypy runs in an isolated env — it cannot see the
        # project env's packages. List BOTH type stubs (types-*) AND every
        # runtime dep mypy needs to resolve types for here, or pre-commit and
        # local `mypy src/` will disagree. `types-all` is deprecated; list
        # stubs individually.
        additional_dependencies:
          - pytest         # tests/ are checked too; without it parametrize is an untyped decorator
          - types-PyYAML

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-ast
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: no-absolute-paths
        name: block absolute filesystem paths
        # Public repo: this guard stays. `.example` files are safe because they
        # use placeholder paths that do not match the pattern, not because
        # they are exempted.
        entry: bash -c 'git diff --cached --name-only --diff-filter=d -z | grep -zvE "\.pre-commit-config\.yaml$" | xargs -0 -r grep -lE "(/ihme/|/snfs1/|/home/j/|/mnt/share/|^[A-Z]:\\\\)" 2>/dev/null | (! grep .)'
        language: system
        pass_filenames: false
