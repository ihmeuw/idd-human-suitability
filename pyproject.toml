[project]
name = "idd-human-suitability"
version = "0.1.0"
description = "Global, gridded, time-varying habitability metrics (climate-niche and HDI-style), 1950 to 2100"
authors = [{ name = "Bobby Reiner" }]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    # Floors only — no speculative upper caps. Cap only at a version that is
    # tested and actually breaks, at that known number.
    # Sibling idd-* repos: bare names, no version spec (uv.lock pins the commit).
    # Base packages only; an extra is requested when code here first uses the
    # part of the sibling that needs it.
    "idd-spatial-analysis",  # raster windows, regridding, admin boundaries, zonal statistics
    "idd-figures[maps]",     # figure templates; the maps extra (cartopy) is used by lib/figures
    "idd-tools",             # output versioning (idd-versions), atomic IO; jobmon stays behind its extra
    "pyyaml>=6",             # paths.yaml loader
    # Imported directly by lib/. All arrive with the siblings above; declared because a
    # package imported here is a dependency of this repo, not only of a sibling.
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=19",
    "geopandas>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Cluster orchestration through idd_tools.jobmon. Jobmon is an optional extra,
# never core; CI syncs without it. On the cluster:
#   uv sync --extra jobmon
jobmon = ["idd-tools[jobmon]"]

# Cross-repo idd-* dependencies are a bare name in `dependencies` plus a
# [tool.uv.sources] entry pinned to branch = "main" — never unpinned (an
# unpinned git source follows the remote HEAD, i.e. GitHub's default branch).
# One [tool.uv.sources] table per file.
# Bump one: uv lock --upgrade-package <name>
[tool.uv.sources]
idd-spatial-analysis = { git = "ssh://git@github.com/ihmeuw/idd-spatial-analysis.git", branch = "main" }
idd-figures = { git = "ssh://git@github.com/ihmeuw/idd-figures.git", branch = "main" }
idd-tools = { git = "ssh://git@github.com/ihmeuw/idd-tools.git", branch = "main" }
# Belt-and-braces: force the internal jobmon installer to the ihme index even
# if index order ever changes (scaffold-repo template, verbatim).
jobmon_installer_ihme = { index = "ihme" }

# IHME artifactory, consulted before PyPI for internal names (scaffold-repo
# template, verbatim). Only the jobmon extra resolves from it.
[[tool.uv.index]]
name = "ihme"
url = "https://artifactory.ihme.washington.edu/artifactory/api/pypi/pypi-shared/simple"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "ipykernel>=7",  # lets the .venv register as a Jupyter kernel; dev group so package consumers don't inherit it
]

[build-system]
# uv_build is 0.x; upstream promises compatibility only within a minor, so the
# bracket is a known constraint, not a speculative cap. Keep at current minor.
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # trailing comma — formatter handles
    "ISC001",   # implicit string concat — formatter handles
    "ANN",      # type hints — mypy handles
    "D",        # docstrings — too strict for research code
    "E501",     # line length — formatter handles
    "RET505",   # else after return — style preference, sometimes clearer
    "CPY",      # copyright headers — not used in idd-* repos (CPY001 fires under ALL on current ruff)
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "INP001",  # scripts are not a package — no __init__.py needed
    "T201",    # print() is the legitimate output mechanism for CLI scripts
]
"notebooks/**" = [
    "T201",    # print() is how a notebook cell reports what it loaded
]
"tests/**" = [
    "S101",    # assert in tests
    "ARG",     # fixture / parametrize args are sometimes unused in some cases
    "S105",    # hardcoded passwords in tests
    "PLR2004", # magic values are normal in test assertions
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# idd-figures ships a py.typed marker but its functions carry no annotations, so strict mode
# rejects every call into it wherever the package is installed (and accepts them in the
# pre-commit hook's env, where it is absent). Skipping it makes both agree.
[[tool.mypy.overrides]]
module = ["idd_figures", "idd_figures.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
