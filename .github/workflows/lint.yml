name: Lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.10.0       # deploy keys for the ssh:// idd-* git sources
        with:
          ssh-private-key: ${{ secrets.IDD_CI_DEPLOY_KEYS }}
      - uses: astral-sh/setup-uv@v6
        with: { python-version: '3.12' }
      - run: uv sync                             # no extras yet; name them here, never --all-extras
      - run: uv run ruff check src/ tests/
      - run: uv run mypy src/
